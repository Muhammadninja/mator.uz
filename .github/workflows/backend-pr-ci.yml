name: backend-pr-ci

on:
  push:
    branches:
      - claude/nexia-generation
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-pr-ci.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-pr-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ESLint with type information. Violations that already existed are recorded
  # in Backend/eslint-suppressions.json, so only new ones fail. Once old ones
  # are fixed, the run fails until `npm run lint:prune` shrinks the file. The
  # guard step fails a PR that adds or raises a suppression, so a PR cannot
  # record its own new errors with `eslint --suppress-all` or a hand edit.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Test the baseline guard
        run: node --test scripts/ci/eslint-baseline-guard.test.cjs

      - name: Lint baseline may only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/ci/eslint-baseline-guard.cjs "$BASE_SHA"

      - name: Install locked dependencies
        run: npm ci

      # Typed rules read the generated Prisma types.
      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run ESLint (no --fix)
        run: npm run lint:ci

  # Smoke suites in test/smoke. Prisma and Redis are mocked; the database and
  # Redis addresses point at a closed port so nothing real can be reached.
  # In band: under parallel load the throttle suites can hit their 30 s timeout.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:9/unreachable?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:9/unreachable?schema=public
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '9'
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Run e2e smoke tests
        run: npm run test:e2e -- --ci --runInBand

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mator_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mator_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mator_ci?schema=public
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix Backend

      - name: Validate Prisma schema and generate client
        working-directory: Backend
        run: |
          npx prisma validate --schema prisma/schema.prisma
          npx prisma generate --schema prisma/schema.prisma

      - name: Run backend unit tests
        run: npm test --prefix Backend -- --runInBand

      - name: Build backend
        run: npm run build --prefix Backend

      - name: Validate migration order and apply to isolated PostgreSQL
        working-directory: Backend
        run: |
          set -euo pipefail
          for migration in \
            20261113000000_vehicle_image_integration \
            20261115000000_vehicle_model_variants \
            20261116000000_vehicle_image_catalog_key \
            20261117000000_nexia_generation_catalog_rows \
            20261118000000_vehicle_identity_snapshot \
            20261119000000_vehicle_image_lifecycle \
            20261121000000_vehicle_image_catalog_discovery; do
            test -f "prisma/migrations/$migration/migration.sql"
          done
          npx prisma migrate deploy --schema prisma/schema.prisma
          npx prisma migrate status --schema prisma/schema.prisma
          applied=$(psql 'postgresql://postgres:postgres@localhost:5432/mator_ci' -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name IN ('20261113000000_vehicle_image_integration', '20261115000000_vehicle_model_variants', '20261116000000_vehicle_image_catalog_key', '20261117000000_nexia_generation_catalog_rows', '20261118000000_vehicle_identity_snapshot', '20261119000000_vehicle_image_lifecycle', '20261121000000_vehicle_image_catalog_discovery') AND finished_at IS NOT NULL AND rolled_back_at IS NULL")
          test "$applied" = 7
